version: "3.9"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: blackturf_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackturf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackturf_secret}
      POSTGRES_DB: ${POSTGRES_DB:-blackturf}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blackturf}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: blackturf_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackturf_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-blackturf}:${POSTGRES_PASSWORD:-blackturf_secret}@db:5432/${POSTGRES_DB:-blackturf}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - FRONTEND_URL=${FRONTEND_URL:-https://blackturf.fr}
    ports:
      # Publié sur la LOOPBACK uniquement. nginx atteint l'API par le réseau
      # Docker (`set $api_upstream http://api:8000` + resolver 127.0.0.11), pas
      # par ce mapping : le publier sur 0.0.0.0 exposait l'API brute à Internet,
      # en contournant nginx. Combiné à `--forwarded-allow-ips=*`, n'importe qui
      # pouvait alors usurper X-Forwarded-For (rate-limiting et logs d'IP
      # faussés). Seul un pare-feu Hetzner en amont l'empêchait — une garantie
      # hors du dépôt, donc invisible et fragile.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ml_models:/app/models
      - scrape_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  scraper:
    build:
      context: ./backend
      dockerfile: Dockerfile.scraper
    container_name: blackturf_scraper
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-blackturf}:${POSTGRES_PASSWORD:-blackturf_secret}@db:5432/${POSTGRES_DB:-blackturf}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - BRIGHTDATA_PROXY=${BRIGHTDATA_PROXY}
      - SCRAPER_INTERVAL=${SCRAPER_INTERVAL:-5}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - scrape_data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackturf_worker
    command: python -m rq worker default ml --with-scheduler --url ${REDIS_URL:-redis://:redis_secret@redis:6379/0}
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-blackturf}:${POSTGRES_PASSWORD:-blackturf_secret}@db:5432/${POSTGRES_DB:-blackturf}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ml_models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* sont figées au build par Next.js (inlinées dans le bundle JS),
      # PAS lues au runtime : les passer seulement sous `environment:` ci-dessous ne
      # fait rien. Sans ce bloc `args`, `docker compose build frontend` compile avec
      # ces variables VIDES (le Dockerfile les déclare en ARG sans défaut) → fetch
      # vers une URL relative au build → hang + échec de génération statique de "/"
      # (constaté le 2026-08-17, contourné une fois via --build-arg en ligne de
      # commande ; ceci le rend permanent pour tout futur rebuild).
      args:
        NEXT_PUBLIC_API_URL: https://api.blackturf.fr
        NEXT_PUBLIC_WS_URL: wss://api.blackturf.fr/ws
    container_name: blackturf_frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://api.blackturf.fr
      - NEXT_PUBLIC_WS_URL=wss://api.blackturf.fr/ws
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - api
    healthcheck:
      # 127.0.0.1 (IPv4) et pas localhost : next-server écoute sur 0.0.0.0 (IPv4),
      # localhost résout en ::1 (IPv6) → "connection refused" = conteneur unhealthy à tort.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: blackturf_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ml_models:
  scrape_data:
