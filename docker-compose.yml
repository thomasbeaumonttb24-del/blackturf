version: "3.9"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: blackturf_db
    # /dev/shm : Docker plafonne à 64 Mo par défaut, et PostgreSQL y alloue la
    # mémoire partagée DYNAMIQUE de ses workers parallèles (~8 Mo par segment).
    # Sous 64 Mo, tout plan parallèle sur une grosse table meurt en
    # « could not resize shared memory segment : No space left on device » —
    # panne constatée le 20/08/2026 : /admin/api/dashboard en 500 (transaction
    # avortée) et 9 `post_course_sync` en échec par jour. 256 Mo = 4x l'usage
    # observé, et reste très en dessous du plafond mémoire du conteneur.
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackturf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD absent du .env}
      POSTGRES_DB: ${POSTGRES_DB:-blackturf}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
    # Lie a la boucle locale, JAMAIS a 0.0.0.0. Docker publie ses ports en
    # ecrivant des regles DNAT en amont des chaines que ufw manipule : un
    # pare-feu hote « classique » ne les couvre pas. Surtout, `docker-proxy`
    # ecoute aussi sur [::], et la protection IPv4 en place (DOCKER-USER +
    # pare-feu Hetzner) ne couvrait pas l'IPv6 : le 27/08/2026, Postgres,
    # Redis et le frontend etaient joignables depuis Internet sur
    # [2a01:4f8:c015:5441::1]. Le port n'a a etre publie que pour l'hote.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blackturf}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: blackturf_redis
    # `:?` et non `:-` : un repli silencieux sur un mot de passe ecrit en clair
    # dans un depot public est pire que pas de mot de passe du tout, car rien
    # ne signale la bascule. Une variable absente du .env doit faire ECHOUER le
    # demarrage — c'est deja arrive sur ce projet (ACCESS_TOKEN_EXPIRE_MINUTES
    # n'atteignait pas le conteneur, sans le moindre message).
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD absent du .env}
    ports:
    # Lie a la boucle locale, JAMAIS a 0.0.0.0. Docker publie ses ports en
    # ecrivant des regles DNAT en amont des chaines que ufw manipule : un
    # pare-feu hote « classique » ne les couvre pas. Surtout, `docker-proxy`
    # ecoute aussi sur [::], et la protection IPv4 en place (DOCKER-USER +
    # pare-feu Hetzner) ne couvrait pas l'IPv6 : le 27/08/2026, Postgres,
    # Redis et le frontend etaient joignables depuis Internet sur
    # [2a01:4f8:c015:5441::1]. Le port n'a a etre publie que pour l'hote.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD absent du .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackturf_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-blackturf}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD absent du .env}@db:5432/${POSTGRES_DB:-blackturf}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD absent du .env}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - FRONTEND_URL=${FRONTEND_URL:-https://blackturf.fr}
    ports:
      # Publié sur la LOOPBACK uniquement. nginx atteint l'API par le réseau
      # Docker (`set $api_upstream http://api:8000` + resolver 127.0.0.11), pas
      # par ce mapping : le publier sur 0.0.0.0 exposait l'API brute à Internet,
      # en contournant nginx. Combiné à `--forwarded-allow-ips=*`, n'importe qui
      # pouvait alors usurper X-Forwarded-For (rate-limiting et logs d'IP
      # faussés). Seul un pare-feu Hetzner en amont l'empêchait — une garantie
      # hors du dépôt, donc invisible et fragile.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ml_models:/app/models
      - scrape_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  scraper:
    build:
      context: ./backend
      dockerfile: Dockerfile.scraper
    container_name: blackturf_scraper
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-blackturf}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD absent du .env}@db:5432/${POSTGRES_DB:-blackturf}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD absent du .env}@redis:6379/0
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - BRIGHTDATA_PROXY=${BRIGHTDATA_PROXY}
      - SCRAPER_INTERVAL=${SCRAPER_INTERVAL:-5}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - scrape_data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackturf_worker
    command: python -m rq worker default ml --with-scheduler --url ${REDIS_URL:-redis://:redis_secret@redis:6379/0}
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-blackturf}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD absent du .env}@db:5432/${POSTGRES_DB:-blackturf}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD absent du .env}@redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ml_models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* sont figées au build par Next.js (inlinées dans le bundle JS),
      # PAS lues au runtime : les passer seulement sous `environment:` ci-dessous ne
      # fait rien. Sans ce bloc `args`, `docker compose build frontend` compile avec
      # ces variables VIDES (le Dockerfile les déclare en ARG sans défaut) → fetch
      # vers une URL relative au build → hang + échec de génération statique de "/"
      # (constaté le 2026-08-17, contourné une fois via --build-arg en ligne de
      # commande ; ceci le rend permanent pour tout futur rebuild).
      args:
        NEXT_PUBLIC_API_URL: https://api.blackturf.fr
        NEXT_PUBLIC_WS_URL: wss://api.blackturf.fr/ws
    container_name: blackturf_frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://api.blackturf.fr
      - NEXT_PUBLIC_WS_URL=wss://api.blackturf.fr/ws
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
    ports:
    # Lie a la boucle locale, JAMAIS a 0.0.0.0. Docker publie ses ports en
    # ecrivant des regles DNAT en amont des chaines que ufw manipule : un
    # pare-feu hote « classique » ne les couvre pas. Surtout, `docker-proxy`
    # ecoute aussi sur [::], et la protection IPv4 en place (DOCKER-USER +
    # pare-feu Hetzner) ne couvrait pas l'IPv6 : le 27/08/2026, Postgres,
    # Redis et le frontend etaient joignables depuis Internet sur
    # [2a01:4f8:c015:5441::1]. Le port n'a a etre publie que pour l'hote.
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    healthcheck:
      # 127.0.0.1 (IPv4) et pas localhost : next-server écoute sur 0.0.0.0 (IPv4),
      # localhost résout en ::1 (IPv6) → "connection refused" = conteneur unhealthy à tort.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: blackturf_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ml_models:
  scrape_data:
