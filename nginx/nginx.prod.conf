user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Masque la version nginx (anti-fingerprinting de CVE)
    server_tokens off;

    # Anti-Slowloris : timeouts courts de lecture client + buffers bornés.
    # Sans ça, des connexions lentes saturent les workers (DoS trivial).
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    client_body_buffer_size 16k;
    large_client_header_buffers 2 8k;
    reset_timedout_connection on;

    # Limite de connexions concurrentes par IP (anti-flood)
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # Docker embedded DNS — re-resolve upstream container IPs at runtime
    # (containers get new IPs when recreated on deploy; without this nginx
    #  caches the IP at startup and returns 502 after any api/frontend redeploy)
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main buffer=16k flush=5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # OPTIONS preflight CORS = sans payload + double chaque XHR navigateur -> exempte du quota (cle vide = non compte)
    map $request_method $limit_key {
        default $binary_remote_addr;
        OPTIONS "";
    }
    limit_req_zone $limit_key zone=api:10m rate=20r/s;
    limit_req_zone $limit_key zone=auth:10m rate=10r/m;
    limit_req_status 429;   # 429 Too Many Requests (au lieu du 503 par défaut)
    limit_conn_status 429;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name api.blackturf.fr;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Certbot ACME challenge (port 80)
    server {
        listen 80;
        server_name blackturf.fr www.blackturf.fr;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://blackturf.fr$request_uri;
        }
    }

    # API — api.blackturf.fr
    server {
        listen 443 ssl http2;
        server_name api.blackturf.fr;

        # upstream as a variable so the resolver re-resolves it per request
        set $api_upstream http://api:8000;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        limit_conn perip 30;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        # Stripe webhook — no rate limit
        location /api/v1/stripe/webhook {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth — rate limit strict (login/register/reset/forgot)
        location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket
        location /ws/ {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # API general
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # Admin API — rate limit (endpoint sensible, anti brute-force)
        location /admin/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Frontend — blackturf.fr (Next.js)
    server {
        listen 443 ssl http2;
        server_name blackturf.fr www.blackturf.fr;

        # upstream as a variable so the resolver re-resolves it per request
        set $frontend_upstream http://frontend:3000;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        limit_conn perip 50;

        # En-têtes de sécurité (clickjacking, sniffing, referrer, permissions, CSP).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self)" always;
        # CSP : autorise Next.js (inline) + Stripe.js. frame-ancestors 'none' = anti-clickjacking.
        # 'unsafe-inline'/'unsafe-eval' nécessaires à l'hydratation Next ; restreint surtout
        # les ORIGINES de scripts/connexions (bloque l'exfiltration vers un domaine tiers).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.blackturf.fr wss://api.blackturf.fr https://js.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Pas de limit_req ici : une page Next charge des dizaines d'assets → un
        # rate-limit par requête s'auto-DoS. limit_conn (ci-dessus) suffit anti-flood.
        location / {
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
