# Drop-in commun aux trois daemons de cotes (zeturf / genybet / oddschecker).
#
# POURQUOI : ces daemons tournent HORS Docker — aucune limite mémoire ne les
# couvrait. Chacun pilote un camoufox (Firefox) via Playwright et ne recycle
# jamais le navigateur : au 20/08/2026, après deux jours, ils cumulaient 3,6 Go
# contre 2,1 Go au démarrage (~0,75 Go de fuite par jour).
#
# La nuit du 19→20/08 le kernel a déclenché un OOM GLOBAL depuis
# zeturf-odds.service, et a choisi comme victime le plus gros RSS de la machine :
# le worker rq en plein retrain nocturne (4,9 Go). Le retrain n'y était pour
# rien — il avait déployé v511 quatre-vingt-dix secondes plus tôt.
#
# MemoryHigh : seuil de pression ; le kernel récupère au lieu de tuer.
# MemoryMax  : plafond dur. Le daemon meurt, Restart=always le relance en 15-20 s.
#              Perdre 20 s d'échantillonnage de cotes est sans commune mesure
#              avec perdre la nuit d'apprentissage.
# OOMScoreAdjust : si un OOM global survient malgré tout, le kernel doit choisir
#              CES processus — qui redémarrent seuls — et jamais le retrain.
[Service]
MemoryHigh=1100M
MemoryMax=1600M
MemorySwapMax=512M
OOMScoreAdjust=600
