# Drop-in de durcissement commun aux trois daemons de cotes
# (zeturf-odds / genybet-odds / oddschecker-odds).
#
# À déposer dans /etc/systemd/system/<unité>.service.d/60-hardening.conf
#
# POURQUOI : ces trois services tournent HORS Docker, en root, et pilotent un
# Firefox complet (Camoufox) sur des sites tiers qu'on ne contrôle pas. Le
# navigateur est le composant qui prend le plus de failles chaque année, et il
# est ici exposé à du contenu distant sans aucun bac à sable de conteneur.
#
# CE QUI N'EST DÉLIBÉRÉMENT PAS POSÉ, et pourquoi — chacune de ces directives
# tuerait le navigateur SANS tuer le daemon, donc sans redémarrage, sans erreur,
# et sans que rien ne le signale (le mode de panne le plus coûteux ici) :
#
#   ProtectHome=true        Camoufox vit dans /root/.cache/camoufox. Masquer
#                           /root le rend introuvable.
#   ProtectSystem=strict    rendrait /var/log en lecture seule, or les unités
#                           écrivent leurs journaux via
#                           StandardOutput=append:/var/log/<nom>-odds.log.
#                           `full` protège /usr, /boot et /etc sans y toucher.
#   PrivateDevices=true     prive le processus de /dev/shm, dont Firefox a besoin.
#   SystemCallFilter=…      filtrer les appels système d'un navigateur est un
#                           terrain miné : le coût de mise au point dépasse le
#                           gain tant que le reste n'est pas en place.
#   CapabilityBoundingSet=  le bac à sable de Firefox s'appuie sur les espaces de
#                           noms utilisateur ; retirer les capacités demande une
#                           campagne de tests à part.
#
# CE QUI RESTE À FAIRE, et qui vaut bien plus que ce fichier : ces daemons
# écrivent en base par `docker exec … psql`, ce qui suppose l'accès au démon
# Docker, c'est-à-dire l'équivalent de root. Tant que c'est le cas, `User=` ne
# change rien à la sécurité réelle. La vraie correction est de les faire parler
# à PostgreSQL en TCP avec le rôle applicatif bt_app, puis de les passer sous un
# utilisateur dédié hors du groupe docker.
[Service]
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=full
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictNamespaces=false
LockPersonality=true
