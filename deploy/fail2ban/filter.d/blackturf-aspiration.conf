# Aspiration de l'API : une IP qui enchaine les appels /api/ a un debit qu'aucun
# navigateur n'atteint. Le seuil est dans le jail (maxretry/findtime), ce filtre
# ne fait que COMPTER les appels API.
#
# Declencheur (2026-10-08) : la sentinelle a signale 176.146.154.55 a 1 626
# requetes en 5 min (~5,4/s), sous la limite nginx de la zone `api` (20 r/s par
# IP) : nginx laissait donc tout passer.
#
# Ce qui est compte : toute requete /api/ hors OPTIONS (le preflight CORS double
# chaque appel XHR du navigateur, cf. `map $request_method $limit_key` dans
# nginx.prod.conf). Les fichiers statiques (/_next/, images) et les pages ne
# sont PAS comptes : une page Next en charge des dizaines, c'est ce qui rendait
# le compteur de la sentinelle trop sensible.
#
# FICHIER HOTE SEULEMENT, jamais le journal Docker : nginx ecrit chaque ligne aux
# deux destinations, les lire toutes les deux compterait chaque appel deux fois.
#
# `.*` pour sauter l'horodatage, PAS de classe `[^]]` : cf. blackturf-scanners.conf,
# une telle classe fait charger fail2ban avec zero failregex, sans erreur.
[Definition]
failregex = ^<HOST> - .*"(?:GET|POST|PUT|PATCH|DELETE|HEAD) /api/

ignoreregex =

datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S
