# Scanners web automatises frappant blackturf.fr.
#
# DEUX FORMATS, parce qu'il y a deux journaux (2026-08-31) :
#
#   1. Le FICHIER nginx sur l'hote, /opt/blackturf/nginx/logs/access.log :
#        51.89.71.147 - [31/Aug/2026:19:33:13 +0000] "GET /.env HTTP/1.1" 404 …
#      C'est la source a privilegier : son chemin ne change JAMAIS.
#
#   2. Le journal Docker, /var/lib/docker/containers/<id>/<id>-json.log, ou la
#      ligne nginx est la valeur de la cle "log" et ses guillemets sont echappes
#      en \". D'ou l'ancrage sur ^\{"log":".
#      Conserve en second : il couvre la periode ou seul stdout existait, et il
#      reste alimente (nginx ecrit aux deux destinations).
#
# POURQUOI LE FICHIER EST DEVENU LA SOURCE PRINCIPALE. Le jail visait le journal
# Docker par un glob. fail2ban ne developpe un glob qu'au demarrage ou au reload :
# a chaque recreation du conteneur nginx — c'est-a-dire a chaque deploiement —
# l'identifiant change, le fichier surveille disparait, et le jail se tait sans
# rien signaler. Constate le 2026-08-31 apres une recreation :
#     fail2ban-client status blackturf-scanners  ->  File list:   (vide)
# 1 142 echecs comptabilises historiquement, 4 IP bannies, et plus aucun fichier
# lu. Le commentaire du jail redoutait deja ce mode de panne ; le glob ne
# suffisait pas a l'eviter.
#
# On ne bannit PAS sur le code 404 : un 404 est aussi ce que produit un lien
# casse ou un explorateur legitime. On bannit sur des CHEMINS qu aucun
# visiteur ni aucun robot d indexation ne demande jamais.
[Definition]
_motifs = (?i:/\.env|/\.git/|/\.aws/|/\.ssh/|wp-admin|wp-login|xmlrpc\.php|phpmyadmin|/actuator|/cgi-bin/|/vendor/phpunit|/\.vscode/|/telescope/requests|/_ignition/|/solr/|/druid/|/hudson|/jenkins)

# `.*` et surtout PAS une classe de caracteres pour sauter l horodatage : une
# regex contenant `[^]]` fait charger fail2ban avec ZERO failregex, sans erreur —
# `fail2ban-regex` affiche « Failregex: 0 total » et toutes les lignes en
# « missed ». Le jail se comporte alors exactement comme s il etait desactive.
# Verifie par bissection le 2026-08-31 sur du trafic reel.
#
# Les deux motifs sont bien disjoints : la ligne du FICHIER commence par l IP,
# celle du journal Docker par `{"log":"`. Un `^<HOST>` ne peut donc pas matcher
# une ligne JSON, et reciproquement.
failregex = ^<HOST> - .*%(_motifs)s
            ^\{"log":"<HOST> - .*%(_motifs)s

ignoreregex =

# Les deux formats de date, dans le meme ordre que les deux failregex.
datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S
              "time":"%%Y-%%m-%%dT%%H:%%M:%%S
