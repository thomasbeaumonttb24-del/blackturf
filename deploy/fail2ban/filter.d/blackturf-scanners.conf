# Scanners web automatises frappant blackturf.fr.
#
# Les journaux nginx sortent sur stdout et Docker les enveloppe en JSON : la
# ligne d acces est la valeur de la cle "log", et ses guillemets y sont
# echappes en \". D ou l ancrage sur ^\{"log":" plutot que sur un debut de
# ligne nginx classique.
#
# On ne bannit PAS sur le code 404 : un 404 est aussi ce que produit un lien
# casse ou un explorateur legitime. On bannit sur des CHEMINS qu aucun
# visiteur ni aucun robot d indexation ne demande jamais.
[Definition]
failregex = ^\{"log":"<HOST> - .*(?i:/\.env|/\.git/|/\.aws/|/\.ssh/|wp-admin|wp-login|xmlrpc\.php|phpmyadmin|/actuator|/cgi-bin/|/vendor/phpunit|/\.vscode/|/telescope/requests|/_ignition/|/solr/|/druid/|/hudson|/jenkins)
ignoreregex =
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S
