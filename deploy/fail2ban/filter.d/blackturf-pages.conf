# Aspiration des PAGES (HTML rendues par Next) : complement de blackturf-aspiration,
# qui ne compte que /api/. Declencheur 2026-10-08 : 176.146.154.55, script "node"
# qui parcourait /resultats/<jour> puis chaque /courses/<id>, 1 626 pages en 5 min,
# zero appel /api/ -> la prison API ne l aurait jamais vu.
# Statiques (_next, images, polices, robots, sitemap...) exclus : une page en charge
# des dizaines. Les prefetch RSC (?_rsc=) restent comptes : pic humain mesure 251/5 min.
# Seuil (jail) : 900 pages / 5 min. Pic robots mesure sur 30 j : 652 (ClaudeBot).
[Definition]
failregex = ^<HOST> - .*"(?:GET|HEAD) /(?!api/|_next/|img/|images/|fonts/|static/|icon|favicon|apple-|manifest|robots|sitemap|og)(?![^ ?]*\.(?:png|jpe?g|webp|avif|gif|svg|ico|css|js|woff2?|xml|txt|map|json)[ ?])

