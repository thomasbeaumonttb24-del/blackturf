[blackturf-scanners]
enabled  = true
filter   = blackturf-scanners
# Glob plutot que le chemin d un conteneur : l identifiant change a chaque
# recreation de nginx (un simple deploiement), et un jail pointant vers un
# fichier disparu se tait sans rien signaler.
logpath  = /var/lib/docker/containers/*/*-json.log
backend  = polling

maxretry = 2
findtime = 600
bantime  = 86400

# DECISIF : avec Docker, le trafic vers un conteneur est route (FORWARD), il ne
# traverse PAS INPUT. Un bannissement pose dans INPUT — le defaut de fail2ban —
# n aurait donc AUCUN effet. fail2ban insere sa chaine f2b-* en tete de
# DOCKER-USER, donc avant les ACCEPT sur 80 et 443.
chain     = DOCKER-USER
banaction = iptables-multiport
port      = http,https
protocol  = tcp

# 81.65.152.46 = poste de l exploitant. Les sondes d audit ressemblent trait
# pour trait a un scanner (/.env, /.git/config) : sans cette ligne, un audit
# se solderait par un auto-bannissement de 24 h.
ignoreip = 127.0.0.1/8 ::1 81.65.152.46 172.17.0.0/16 172.18.0.0/16
