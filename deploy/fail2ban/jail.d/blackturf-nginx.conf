[blackturf-scanners]
enabled  = true
filter   = blackturf-scanners
# CHEMIN STABLE EN PREMIER (2026-08-31). Le glob ne suffisait pas : fail2ban ne
# le developpe qu au demarrage ou au reload. A chaque recreation du conteneur
# nginx — c est-a-dire a chaque deploiement — l identifiant change, le fichier
# surveille disparait, et le jail se tait sans rien signaler. C est exactement ce
# que ce commentaire redoutait, et c est arrive : constate le 2026-08-31 apres
# une recreation, `fail2ban-client status blackturf-scanners` renvoyait une
# « File list » VIDE pour 1 142 echecs historiques et 4 IP bannies.
#
# /opt/blackturf/nginx/logs/access.log est ecrit directement par nginx (montage
# depuis l hote, cf. docker-compose.prod.yml) : son chemin ne change jamais,
# quelle que soit la recreation. Le glob Docker reste en second — il couvre la
# periode ou seul stdout existait, et nginx alimente toujours les deux.
logpath  = /opt/blackturf/nginx/logs/access.log
           /var/lib/docker/containers/*/*-json.log
backend  = polling

maxretry = 2
findtime = 600
bantime  = 86400

# DECISIF : avec Docker, le trafic vers un conteneur est route (FORWARD), il ne
# traverse PAS INPUT. Un bannissement pose dans INPUT — le defaut de fail2ban —
# n aurait donc AUCUN effet. fail2ban insere sa chaine f2b-* en tete de
# DOCKER-USER, donc avant les ACCEPT sur 80 et 443.
chain     = DOCKER-USER
banaction = iptables-multiport
port      = http,https
protocol  = tcp

# Les sondes d audit ressemblent trait pour trait a un scanner (/.env,
# /.git/config). L IP du poste d exploitation s ajoute ICI SUR LE SERVEUR
# seulement, jamais dans le depot (public) : la publier dirait a un attaquant
# quelle adresse le pare-feu ne bannit jamais. Mieux : auditer depuis le VPS.
ignoreip = 127.0.0.1/8 ::1 172.17.0.0/16 172.18.0.0/16
