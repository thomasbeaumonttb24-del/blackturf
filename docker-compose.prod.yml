version: "3.9"

# Production compose — Hetzner CX31 (2 vCPU / 8GB RAM / ~12€/month)
# Frontend → Vercel (free). Only backend services here.
# Deploy: docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: blackturf_db
    # /dev/shm : Docker plafonne à 64 Mo par défaut, et PostgreSQL y alloue la
    # mémoire partagée DYNAMIQUE de ses workers parallèles (~8 Mo par segment).
    # Sous 64 Mo, tout plan parallèle sur une grosse table meurt en
    # « could not resize shared memory segment : No space left on device » —
    # panne constatée le 20/08/2026 : /admin/api/dashboard en 500 (transaction
    # avortée) et 9 `post_course_sync` en échec par jour. 256 Mo = 4x l'usage
    # observé, et reste très en dessous du plafond mémoire du conteneur.
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Memory tuning for small VPS
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=fr_FR.UTF-8"
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=1GB
      -c max_connections=50
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: blackturf_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackturf_api
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # --proxy-headers : sans lui uvicorn ignore le X-Forwarded-Proto de nginx et
    # construit ses redirections 307 en http:// — le navigateur, sur une page https,
    # refuse de les suivre (contenu mixte) et la requête meurt en silence.
    # `--forwarded-allow-ips=*` fait confiance aux en-têtes X-Forwarded-* de
    # l'appelant : ce n'est acceptable que parce que le port 8000 est publié sur
    # la LOOPBACK (`127.0.0.1:8000:8000`, docker-compose.yml) et que nginx est le
    # seul ingress. Republier ce port sur 0.0.0.0 ouvrirait l'usurpation d'IP.
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-access-log --proxy-headers --forwarded-allow-ips=*
    environment:
      # Role applicatif, PAS le superutilisateur PostgreSQL. Le role bootstrap
      # (POSTGRES_USER) ne peut pas perdre son attribut superutilisateur — le
      # moteur le refuse — et un superutilisateur peut executer des commandes
      # shell via COPY ... TO PROGRAM : la moindre injection SQL vaudrait alors
      # execution de code dans le conteneur. bt_app herite des privileges de
      # proprietaire de blackturf (donc tout fonctionne, y compris les tables
      # creees a l'execution et les migrations) mais n'herite PAS de l'attribut
      # superutilisateur, et le GRANT porte SET FALSE : il ne peut pas non plus
      # basculer dessus par SET ROLE.
      - DATABASE_URL=postgresql+asyncpg://${APP_DB_USER:?APP_DB_USER absent du .env}:${APP_DB_PASSWORD:?APP_DB_PASSWORD absent du .env}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # Lue par services/data_quality : sans elle, le moniteur signale comme
      # « scraper muet » une source volontairement mise en sommeil.
      - SCRAPER_DISABLED_SOURCES=${SCRAPER_DISABLED_SOURCES:-}
      - SECRET_KEY=${SECRET_KEY}
      # Duree de vie des jetons. ABSENTE de ce bloc jusqu'au 19/08 : le .env
      # declarait ACCESS_TOKEN_EXPIRE_MINUTES=60 mais la variable n'atteignait
      # jamais le conteneur, qui retombait sur le defaut du code (720 min). Un
      # jeton d'acces vivait donc 12 h au lieu de l'heure configuree, et rien ne
      # le signalait puisque la valeur voulue etait bien dans .env.
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - BETFAIR_INGEST_TOKEN=${BETFAIR_INGEST_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_PRICE_STARTER_MONTHLY=${STRIPE_PRICE_STARTER_MONTHLY}
      - STRIPE_PRICE_STARTER_ANNUAL=${STRIPE_PRICE_STARTER_ANNUAL}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY}
      - STRIPE_PRICE_PRO_ANNUAL=${STRIPE_PRICE_PRO_ANNUAL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - INDEXNOW_KEY=${INDEXNOW_KEY:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - INSTAGRAM_USER_ID=${INSTAGRAM_USER_ID:-}
      - INSTAGRAM_PUBLICATION_ACTIVE=${INSTAGRAM_PUBLICATION_ACTIVE:-0}
      - INSTAGRAM_API_HOST=${INSTAGRAM_API_HOST:-graph.instagram.com}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SENTRY_DSN=${SENTRY_DSN}
      - ENVIRONMENT=production
      - RUN_SCHEDULER=0
      - FRONTEND_URL=https://blackturf.fr
      - ALLOWED_ORIGINS=["https://blackturf.fr","https://www.blackturf.fr"]
      # ── Flags algo (audit edge 2026-06-14) — cf. backend/ml/algo_flags.py + ALGO_FIXES_2026-06-14.md.
      # TOUT activé (2026-06-14, "active tout") : anti-leakage + dé-vig + calibration honnête
      # + dashboards vrais + combos EV honnête + STAKING-SAFE (cap bankroll + no gain-target dump).
      - BT_GROUP_SPLIT=${BT_GROUP_SPLIT:-1}
      - BT_TRAIN_PRERACE_ONLY=${BT_TRAIN_PRERACE_ONLY:-1}
      - BT_CALIB_GUARD=${BT_CALIB_GUARD:-1}
      - BT_DEVIG_GATES=${BT_DEVIG_GATES:-1}
      - BT_ROI_DEPLOY_GATE=${BT_ROI_DEPLOY_GATE:-1}
      - BT_CALIB_ON_RAW=${BT_CALIB_ON_RAW:-1}
      - BT_OOS_WEIGHTS=${BT_OOS_WEIGHTS:-1}
      - BT_COLLAPSE_LONGSHOT=${BT_COLLAPSE_LONGSHOT:-1}
      - BT_COMBO_EV_NONE=${BT_COMBO_EV_NONE:-1}
      - BT_TEMP_FIT=${BT_TEMP_FIT:-1}
      - BT_STAKING_SAFE=${BT_STAKING_SAFE:-1}
      - BT_RANKER_BLEND=${BT_RANKER_BLEND:-1}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ml_models:/app/models
      - scrape_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M

  scraper:
    build:
      context: ./backend
      dockerfile: Dockerfile.scraper
    container_name: blackturf_scraper
    # Le scraper tournait en root, seul des huit conteneurs dans ce cas, parce que
    # Playwright installait chromium sous /root/.cache/ms-playwright — inaccessible
    # à un utilisateur non privilégié. Dockerfile.scraper l'installe désormais dans
    # /ms-playwright, lisible par tous, et le conteneur tourne en uid 1001 comme api,
    # worker et scheduler. Possible parce que scraper/base.py lance déjà chromium avec
    # --no-sandbox, qui est la configuration recommandée en conteneur.
    environment:
      # Role applicatif, PAS le superutilisateur PostgreSQL. Le role bootstrap
      # (POSTGRES_USER) ne peut pas perdre son attribut superutilisateur — le
      # moteur le refuse — et un superutilisateur peut executer des commandes
      # shell via COPY ... TO PROGRAM : la moindre injection SQL vaudrait alors
      # execution de code dans le conteneur. bt_app herite des privileges de
      # proprietaire de blackturf (donc tout fonctionne, y compris les tables
      # creees a l'execution et les migrations) mais n'herite PAS de l'attribut
      # superutilisateur, et le GRANT porte SET FALSE : il ne peut pas non plus
      # basculer dessus par SET ROLE.
      - DATABASE_URL=postgresql+asyncpg://${APP_DB_USER:?APP_DB_USER absent du .env}:${APP_DB_PASSWORD:?APP_DB_PASSWORD absent du .env}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - INDEXNOW_KEY=${INDEXNOW_KEY:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - INSTAGRAM_USER_ID=${INSTAGRAM_USER_ID:-}
      - INSTAGRAM_PUBLICATION_ACTIVE=${INSTAGRAM_PUBLICATION_ACTIVE:-0}
      - INSTAGRAM_API_HOST=${INSTAGRAM_API_HOST:-graph.instagram.com}
      - BRIGHTDATA_PROXY=${BRIGHTDATA_PROXY:-}
      - SCRAPER_INTERVAL=${SCRAPER_INTERVAL:-5}
      - SCRAPER_INTERVAL_MULTIPLIER=${SCRAPER_INTERVAL_MULTIPLIER:-1.0}
      - SCRAPER_DISABLED_SOURCES=${SCRAPER_DISABLED_SOURCES:-}
      # ── Flags algo (cf. api) — le cycle de prédiction tourne ici (run_predictions_cycle).
      - BT_GROUP_SPLIT=${BT_GROUP_SPLIT:-1}
      - BT_TRAIN_PRERACE_ONLY=${BT_TRAIN_PRERACE_ONLY:-1}
      - BT_CALIB_GUARD=${BT_CALIB_GUARD:-1}
      - BT_DEVIG_GATES=${BT_DEVIG_GATES:-1}
      - BT_ROI_DEPLOY_GATE=${BT_ROI_DEPLOY_GATE:-1}
      - BT_CALIB_ON_RAW=${BT_CALIB_ON_RAW:-1}
      - BT_OOS_WEIGHTS=${BT_OOS_WEIGHTS:-1}
      - BT_COLLAPSE_LONGSHOT=${BT_COLLAPSE_LONGSHOT:-1}
      - BT_COMBO_EV_NONE=${BT_COMBO_EV_NONE:-1}
      - BT_TEMP_FIT=${BT_TEMP_FIT:-1}
      - BT_STAKING_SAFE=${BT_STAKING_SAFE:-1}
      - BT_RANKER_BLEND=${BT_RANKER_BLEND:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - scrape_data:/app/data
      - ml_models:/app/models   # nécessaire : run_predictions_cycle charge le modèle
    restart: unless-stopped
    # Le scraper peut GELER sans mourir (cf. 11/08 : 4 j 16 h de silence, process
    # « Up », 0 exception). Un healthcheck de liveness ne verrait rien → on teste
    # le heartbeat écrit à la fin de chaque cycle. NB : Docker ne redémarre pas un
    # conteneur unhealthy — le kill est fait par le watchdog thread de
    # scraper/orchestrator.py ; ce healthcheck rend la panne VISIBLE et alertable.
    healthcheck:
      test: ["CMD", "python", "/app/scraper/healthcheck.py"]
      interval: 5m
      timeout: 20s
      retries: 2
      start_period: 10m
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackturf_worker
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: rq worker ml default --with-scheduler --url ${REDIS_URL}
    environment:
      # Role applicatif, PAS le superutilisateur PostgreSQL. Le role bootstrap
      # (POSTGRES_USER) ne peut pas perdre son attribut superutilisateur — le
      # moteur le refuse — et un superutilisateur peut executer des commandes
      # shell via COPY ... TO PROGRAM : la moindre injection SQL vaudrait alors
      # execution de code dans le conteneur. bt_app herite des privileges de
      # proprietaire de blackturf (donc tout fonctionne, y compris les tables
      # creees a l'execution et les migrations) mais n'herite PAS de l'attribut
      # superutilisateur, et le GRANT porte SET FALSE : il ne peut pas non plus
      # basculer dessus par SET ROLE.
      - DATABASE_URL=postgresql+asyncpg://${APP_DB_USER:?APP_DB_USER absent du .env}:${APP_DB_PASSWORD:?APP_DB_PASSWORD absent du .env}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ENVIRONMENT=production
      # ── Flags algo (cf. api) — le retrain nightly + calibrations + gate ROI tournent ici (rq).
      - BT_GROUP_SPLIT=${BT_GROUP_SPLIT:-1}
      - BT_TRAIN_PRERACE_ONLY=${BT_TRAIN_PRERACE_ONLY:-1}
      - BT_CALIB_GUARD=${BT_CALIB_GUARD:-1}
      - BT_DEVIG_GATES=${BT_DEVIG_GATES:-1}
      - BT_ROI_DEPLOY_GATE=${BT_ROI_DEPLOY_GATE:-1}
      - BT_CALIB_ON_RAW=${BT_CALIB_ON_RAW:-1}
      - BT_OOS_WEIGHTS=${BT_OOS_WEIGHTS:-1}
      - BT_COLLAPSE_LONGSHOT=${BT_COLLAPSE_LONGSHOT:-1}
      - BT_COMBO_EV_NONE=${BT_COMBO_EV_NONE:-1}
      - BT_TEMP_FIT=${BT_TEMP_FIT:-1}
      - BT_STAKING_SAFE=${BT_STAKING_SAFE:-1}
      - BT_RANKER_BLEND=${BT_RANKER_BLEND:-1}
      # Fenêtre d'historique du retraining. Elle est GLISSANTE : à trois mois elle
      # perdait chaque nuit plus de partants anciens qu'elle n'en gagnait de
      # récents, et le dataset rétrécissait version après version (42 285 le
      # 17/08 → 41 121 le 25/08) alors que la base en contient 175 718
      # exploitables sur douze mois. Le pic RAM est tenu par la construction du
      # dataset par blocs + RETRAIN_MAX_ROWS, pas en jetant de l'historique.
      - RETRAIN_HISTORY_MONTHS=${RETRAIN_HISTORY_MONTHS:-12}
      # Plafond dur : au-delà, seuls les N partants les plus RÉCENTS sont chargés.
      # Un plafond fait STAGNER le compteur, il ne le fait pas décroître.
      - RETRAIN_MAX_ROWS=${RETRAIN_MAX_ROWS:-220000}
      # Nombre de cœurs pris par xgboost/lightgbm/catboost. Chaque thread porte
      # sa propre copie de travail : au-delà de 2 le pic RAM grimpe plus vite
      # que le temps de calcul ne descend sur un VPS 4 vCPU.
      - BT_TRAIN_NJOBS=${BT_TRAIN_NJOBS:-2}
      # glibc alloue jusqu'à 8 arènes par cœur ; chacune garde ses pages libérées
      # au lieu de les rendre au noyau. Sur un process qui alloue des gigas par
      # rafales (dataset puis modèles), la fragmentation seule coûtait plusieurs
      # centaines de Mio de RSS résiduel. 2 arènes suffisent : le retrain est
      # séquentiel, il ne se dispute pas l'allocateur.
      - MALLOC_ARENA_MAX=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ml_models:/app/models
    restart: unless-stopped
    # Le worker doit être le DERNIER candidat de l'OOM killer, jamais le premier.
    # Le 20/08/2026 le kernel a déclenché un OOM global depuis un daemon de cotes
    # et a désigné rq comme victime au seul motif qu'il portait le plus gros RSS
    # (4,9 Gio de retrain). Or c'est le seul process de la machine dont la mort
    # coûte une nuit entière d'apprentissage — les autres redémarrent seuls.
    oom_score_adj: -800
    deploy:
      resources:
        limits:
          # 4G : au-dessus du pic réel du retrain 3 mois une fois le dataset
          # streamé et les arènes rendues au noyau (cf. logs `pipeline.rss`).
          # Le point n'est PAS d'accorder le maximum possible : c'est de faire
          # échouer un retrain devenu glouton DANS son cgroup, tué seul, plutôt
          # que de laisser le kernel arbitrer à l'échelle de l'hôte. L'ancien
          # commentaire affirmait qu'un cap de 6G rendait l'OOM global
          # impossible — c'était faux : les daemons de cotes vivent hors Docker
          # et n'étaient couverts par aucune limite.
          memory: 4G
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    container_name: blackturf_frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: blackturf_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.runtime.conf:/etc/nginx/nginx.conf:ro
      # Journal d'acces PERSISTANT. Sans ce montage, /var/log/nginx/access.log
      # est un symlink vers /dev/stdout dans l'image : tout le trafic part dans
      # le journal Docker, qui disparait avec le conteneur. Une recreation de
      # nginx — c'est-a-dire un deploiement — efface l'historique d'exploration.
      # Le montage masque les symlinks, nginx ecrit de vrais fichiers, et la
      # seconde directive access_log continue d'alimenter stdout pour fail2ban.
      # Rotation : /etc/logrotate.d/blackturf-nginx sur l'hote.
      - ./nginx/logs:/var/log/nginx
      # Monter le RÉPERTOIRE /etc/letsencrypt, jamais les .pem un par un.
      # `live/*.pem` sont des SYMLINKS vers `archive/*N.pem` : un bind-mount de
      # fichier est résolu à la CRÉATION du conteneur et épingle l'inode courant
      # (archive/fullchain1.pem). Après un renouvellement, certbot écrit
      # fullchain2.pem et repointe le symlink — le conteneur, lui, continuerait de
      # servir l'ANCIEN certificat, y compris après `nginx -s reload`, jusqu'à un
      # recreate. En montant le répertoire, le symlink est suivi à la LECTURE :
      # un simple reload suffit à prendre le nouveau certificat.
      - ${TLS_ROOT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackturf_scheduler
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: python scheduler_main.py
    environment:
      # Role applicatif, PAS le superutilisateur PostgreSQL. Le role bootstrap
      # (POSTGRES_USER) ne peut pas perdre son attribut superutilisateur — le
      # moteur le refuse — et un superutilisateur peut executer des commandes
      # shell via COPY ... TO PROGRAM : la moindre injection SQL vaudrait alors
      # execution de code dans le conteneur. bt_app herite des privileges de
      # proprietaire de blackturf (donc tout fonctionne, y compris les tables
      # creees a l'execution et les migrations) mais n'herite PAS de l'attribut
      # superutilisateur, et le GRANT porte SET FALSE : il ne peut pas non plus
      # basculer dessus par SET ROLE.
      - DATABASE_URL=postgresql+asyncpg://${APP_DB_USER:?APP_DB_USER absent du .env}:${APP_DB_PASSWORD:?APP_DB_PASSWORD absent du .env}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # Le job horaire data_quality_check tourne ici : il doit distinguer une
      # source en sommeil assumé d'un scraper réellement tombé.
      - SCRAPER_DISABLED_SOURCES=${SCRAPER_DISABLED_SOURCES:-}
      - SECRET_KEY=${SECRET_KEY}
      - BETFAIR_INGEST_TOKEN=${BETFAIR_INGEST_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_PRICE_STARTER_MONTHLY=${STRIPE_PRICE_STARTER_MONTHLY}
      - STRIPE_PRICE_STARTER_ANNUAL=${STRIPE_PRICE_STARTER_ANNUAL}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY}
      - STRIPE_PRICE_PRO_ANNUAL=${STRIPE_PRICE_PRO_ANNUAL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - INDEXNOW_KEY=${INDEXNOW_KEY:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - INSTAGRAM_USER_ID=${INSTAGRAM_USER_ID:-}
      - INSTAGRAM_PUBLICATION_ACTIVE=${INSTAGRAM_PUBLICATION_ACTIVE:-0}
      - INSTAGRAM_API_HOST=${INSTAGRAM_API_HOST:-graph.instagram.com}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SENTRY_DSN=${SENTRY_DSN}
      - ENVIRONMENT=production
      - RUN_SCHEDULER=1
      - FRONTEND_URL=https://blackturf.fr
      - ALLOWED_ORIGINS=["https://blackturf.fr","https://www.blackturf.fr"]
      # ── Flags algo (audit edge 2026-06-14) — cf. backend/ml/algo_flags.py + ALGO_FIXES_2026-06-14.md.
      # TOUT activé (2026-06-14, "active tout") : anti-leakage + dé-vig + calibration honnête
      # + dashboards vrais + combos EV honnête + STAKING-SAFE (cap bankroll + no gain-target dump).
      - BT_GROUP_SPLIT=${BT_GROUP_SPLIT:-1}
      - BT_TRAIN_PRERACE_ONLY=${BT_TRAIN_PRERACE_ONLY:-1}
      - BT_CALIB_GUARD=${BT_CALIB_GUARD:-1}
      - BT_DEVIG_GATES=${BT_DEVIG_GATES:-1}
      - BT_ROI_DEPLOY_GATE=${BT_ROI_DEPLOY_GATE:-1}
      - BT_CALIB_ON_RAW=${BT_CALIB_ON_RAW:-1}
      - BT_OOS_WEIGHTS=${BT_OOS_WEIGHTS:-1}
      - BT_COLLAPSE_LONGSHOT=${BT_COLLAPSE_LONGSHOT:-1}
      - BT_COMBO_EV_NONE=${BT_COMBO_EV_NONE:-1}
      - BT_TEMP_FIT=${BT_TEMP_FIT:-1}
      - BT_STAKING_SAFE=${BT_STAKING_SAFE:-1}
      - BT_RANKER_BLEND=${BT_RANKER_BLEND:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ml_models:/app/models
      - scrape_data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  ml_models:
  scrape_data:
  certbot_www:
