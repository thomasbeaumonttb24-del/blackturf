version: "3.9"

# Production compose — Hetzner CX31 (2 vCPU / 8GB RAM / ~12€/month)
# Frontend → Vercel (free). Only backend services here.
# Deploy: docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: blackturf_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Memory tuning for small VPS
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=fr_FR.UTF-8"
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=1GB
      -c max_connections=50
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: blackturf_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackturf_api
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-access-log
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - BETFAIR_INGEST_TOKEN=${BETFAIR_INGEST_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_PRICE_STARTER_MONTHLY=${STRIPE_PRICE_STARTER_MONTHLY}
      - STRIPE_PRICE_STARTER_ANNUAL=${STRIPE_PRICE_STARTER_ANNUAL}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY}
      - STRIPE_PRICE_PRO_ANNUAL=${STRIPE_PRICE_PRO_ANNUAL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SENTRY_DSN=${SENTRY_DSN}
      - ENVIRONMENT=production
      - RUN_SCHEDULER=0
      - FRONTEND_URL=https://blackturf.fr
      - ALLOWED_ORIGINS=["https://blackturf.fr","https://www.blackturf.fr"]
      # ── Flags algo (audit edge 2026-06-14) — cf. backend/ml/algo_flags.py + ALGO_FIXES_2026-06-14.md.
      # TOUT activé (2026-06-14, "active tout") : anti-leakage + dé-vig + calibration honnête
      # + dashboards vrais + combos EV honnête + STAKING-SAFE (cap bankroll + no gain-target dump).
      - BT_GROUP_SPLIT=${BT_GROUP_SPLIT:-1}
      - BT_TRAIN_PRERACE_ONLY=${BT_TRAIN_PRERACE_ONLY:-1}
      - BT_CALIB_GUARD=${BT_CALIB_GUARD:-1}
      - BT_DEVIG_GATES=${BT_DEVIG_GATES:-1}
      - BT_ROI_DEPLOY_GATE=${BT_ROI_DEPLOY_GATE:-1}
      - BT_CALIB_ON_RAW=${BT_CALIB_ON_RAW:-1}
      - BT_OOS_WEIGHTS=${BT_OOS_WEIGHTS:-1}
      - BT_COLLAPSE_LONGSHOT=${BT_COLLAPSE_LONGSHOT:-1}
      - BT_COMBO_EV_NONE=${BT_COMBO_EV_NONE:-1}
      - BT_TEMP_FIT=${BT_TEMP_FIT:-1}
      - BT_STAKING_SAFE=${BT_STAKING_SAFE:-1}
      - BT_RANKER_BLEND=${BT_RANKER_BLEND:-1}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ml_models:/app/models
      - scrape_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M

  scraper:
    build:
      context: ./backend
      dockerfile: Dockerfile.scraper
    container_name: blackturf_scraper
    # NOTE sécu : durcissement non-root/cap_drop NON appliqué au scraper — il utilise
    # Dockerfile.scraper (Playwright/chromium) qui nécessite un user/des perms
    # spécifiques (sandbox chromium). À durcir séparément (adapter Dockerfile.scraper).
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - BRIGHTDATA_PROXY=${BRIGHTDATA_PROXY:-}
      - SCRAPER_INTERVAL=${SCRAPER_INTERVAL:-5}
      - SCRAPER_INTERVAL_MULTIPLIER=${SCRAPER_INTERVAL_MULTIPLIER:-1.0}
      - SCRAPER_DISABLED_SOURCES=${SCRAPER_DISABLED_SOURCES:-}
      # ── Flags algo (cf. api) — le cycle de prédiction tourne ici (run_predictions_cycle).
      - BT_GROUP_SPLIT=${BT_GROUP_SPLIT:-1}
      - BT_TRAIN_PRERACE_ONLY=${BT_TRAIN_PRERACE_ONLY:-1}
      - BT_CALIB_GUARD=${BT_CALIB_GUARD:-1}
      - BT_DEVIG_GATES=${BT_DEVIG_GATES:-1}
      - BT_ROI_DEPLOY_GATE=${BT_ROI_DEPLOY_GATE:-1}
      - BT_CALIB_ON_RAW=${BT_CALIB_ON_RAW:-1}
      - BT_OOS_WEIGHTS=${BT_OOS_WEIGHTS:-1}
      - BT_COLLAPSE_LONGSHOT=${BT_COLLAPSE_LONGSHOT:-1}
      - BT_COMBO_EV_NONE=${BT_COMBO_EV_NONE:-1}
      - BT_TEMP_FIT=${BT_TEMP_FIT:-1}
      - BT_STAKING_SAFE=${BT_STAKING_SAFE:-1}
      - BT_RANKER_BLEND=${BT_RANKER_BLEND:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - scrape_data:/app/data
      - ml_models:/app/models   # nécessaire : run_predictions_cycle charge le modèle
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackturf_worker
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: rq worker ml default --with-scheduler --url ${REDIS_URL}
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ENVIRONMENT=production
      # ── Flags algo (cf. api) — le retrain nightly + calibrations + gate ROI tournent ici (rq).
      - BT_GROUP_SPLIT=${BT_GROUP_SPLIT:-1}
      - BT_TRAIN_PRERACE_ONLY=${BT_TRAIN_PRERACE_ONLY:-1}
      - BT_CALIB_GUARD=${BT_CALIB_GUARD:-1}
      - BT_DEVIG_GATES=${BT_DEVIG_GATES:-1}
      - BT_ROI_DEPLOY_GATE=${BT_ROI_DEPLOY_GATE:-1}
      - BT_CALIB_ON_RAW=${BT_CALIB_ON_RAW:-1}
      - BT_OOS_WEIGHTS=${BT_OOS_WEIGHTS:-1}
      - BT_COLLAPSE_LONGSHOT=${BT_COLLAPSE_LONGSHOT:-1}
      - BT_COMBO_EV_NONE=${BT_COMBO_EV_NONE:-1}
      - BT_TEMP_FIT=${BT_TEMP_FIT:-1}
      - BT_STAKING_SAFE=${BT_STAKING_SAFE:-1}
      - BT_RANKER_BLEND=${BT_RANKER_BLEND:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ml_models:/app/models
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    container_name: blackturf_frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: blackturf_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.runtime.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-/etc/letsencrypt/live/blackturf.fr}/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - ${TLS_CERT_DIR:-/etc/letsencrypt/live/blackturf.fr}/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackturf_scheduler
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: python scheduler_main.py
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - BETFAIR_INGEST_TOKEN=${BETFAIR_INGEST_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_PRICE_STARTER_MONTHLY=${STRIPE_PRICE_STARTER_MONTHLY}
      - STRIPE_PRICE_STARTER_ANNUAL=${STRIPE_PRICE_STARTER_ANNUAL}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY}
      - STRIPE_PRICE_PRO_ANNUAL=${STRIPE_PRICE_PRO_ANNUAL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SENTRY_DSN=${SENTRY_DSN}
      - ENVIRONMENT=production
      - RUN_SCHEDULER=1
      - FRONTEND_URL=https://blackturf.fr
      - ALLOWED_ORIGINS=["https://blackturf.fr","https://www.blackturf.fr"]
      # ── Flags algo (audit edge 2026-06-14) — cf. backend/ml/algo_flags.py + ALGO_FIXES_2026-06-14.md.
      # TOUT activé (2026-06-14, "active tout") : anti-leakage + dé-vig + calibration honnête
      # + dashboards vrais + combos EV honnête + STAKING-SAFE (cap bankroll + no gain-target dump).
      - BT_GROUP_SPLIT=${BT_GROUP_SPLIT:-1}
      - BT_TRAIN_PRERACE_ONLY=${BT_TRAIN_PRERACE_ONLY:-1}
      - BT_CALIB_GUARD=${BT_CALIB_GUARD:-1}
      - BT_DEVIG_GATES=${BT_DEVIG_GATES:-1}
      - BT_ROI_DEPLOY_GATE=${BT_ROI_DEPLOY_GATE:-1}
      - BT_CALIB_ON_RAW=${BT_CALIB_ON_RAW:-1}
      - BT_OOS_WEIGHTS=${BT_OOS_WEIGHTS:-1}
      - BT_COLLAPSE_LONGSHOT=${BT_COLLAPSE_LONGSHOT:-1}
      - BT_COMBO_EV_NONE=${BT_COMBO_EV_NONE:-1}
      - BT_TEMP_FIT=${BT_TEMP_FIT:-1}
      - BT_STAKING_SAFE=${BT_STAKING_SAFE:-1}
      - BT_RANKER_BLEND=${BT_RANKER_BLEND:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ml_models:/app/models
      - scrape_data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  ml_models:
  scrape_data:
  certbot_www:
