name: Maintenance ELO

# Lancement MANUEL (onglet Actions → Maintenance ELO → Run workflow).
#
#   elo_a_blanc      recalcule tous les ELO en mémoire, mesure ancien vs nouveau
#                    sur 180 jours, N'ÉCRIT RIEN.
#   elo_grille       compare les variantes de l'algorithme sur l'historique réel,
#                    N'ÉCRIT RIEN.
#   elo_appliquer    même calcul, puis bascule en UNE transaction (ratings,
#                    elo_historique, snapshots participations.elo_avant_*).
#   (features_12_mois retiré le 27/09/2026 : le recalcul complet relit l'état
#   actuel de la base et a fait fuir le résultat dans tout l'historique.)
#   retrain          réentraînement complet (même fonction et même verrou que celui
#                    de 02:00 UTC ; promotion seulement si le gate le valide).
#                    Arrière-plan, suivi avec `statut`.
#   conf_calcul      patch des features conf_* (clé « même course », 30/09/2026) :
#                    calcul LECTURE SEULE depuis le 2025-09-01, en arrière-plan,
#                    fichiers dans /app/models/patch_conf/. Suivi avec `statut`.
#   conf_appliquer   écrit les clés conf_* du fichier dans features_ml.
#   conf_retour      réécrit les anciennes valeurs du fichier (annulation).
#   statut           dernières lignes des journaux de maintenance.
#
# Chaque action tourne dans un conteneur JETABLE du service worker
# (`compose run --rm --no-deps`) : même image, mêmes variables, sa propre limite
# mémoire, sans toucher au worker RQ ni au retrain de nuit.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        type: choice
        options: [elo_a_blanc, elo_grille, elo_appliquer, retrain,
                  conf_calcul, conf_appliquer, conf_retour, statut]

concurrency:
  group: maintenance-elo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Exécution sur le VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 90m
          script: |
            set -e
            cd /opt/blackturf
            DC="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            LOGS=/opt/blackturf/backups
            mkdir -p "$LOGS"
            ACTION="${{ inputs.action }}"
            case "$ACTION" in
              elo_a_blanc|elo_grille|elo_appliquer)
                OPT=""
                if [ "$ACTION" = elo_appliquer ]; then OPT="--appliquer"; fi
                if [ "$ACTION" = elo_grille ]; then OPT="--grille"; fi
                echo "=== $(date -u) $ACTION ($(git rev-parse --short HEAD))" >> "$LOGS/maintenance-elo.log"
                RC=0
                $DC run --rm --no-deps -T worker python -m scripts.elo_recalcul $OPT \
                  > /tmp/maintenance-elo.out 2>&1 || RC=$?
                grep -v '^\[elo\] [0-9]*/' /tmp/maintenance-elo.out | grep -v '^20[0-9-]* ' \
                  | tee -a "$LOGS/maintenance-elo.log" || true
                echo "code retour : $RC"
                exit $RC
                ;;
              retrain)
                if docker ps --format '{{.Names}}' | grep -q '^bt_retrain_manuel$'; then
                  echo "Réentraînement déjà en cours."; exit 0
                fi
                $DC run -d --rm --no-deps --name bt_retrain_manuel worker \
                  sh -c "python -c 'import asyncio; from ml.pipeline import run_nightly_retraining; asyncio.run(run_nightly_retraining())' >> /app/models/retrain-manuel.log 2>&1"
                sleep 30
                docker ps --format '{{.Names}} {{.Status}}' | grep bt_retrain_manuel || echo "ATTENTION : conteneur absent après 30 s"
                ;;
              conf_calcul)
                if docker ps --format '{{.Names}}' | grep -q '^bt_patch_conf$'; then
                  echo "Calcul du patch conf_* déjà en cours."; exit 0
                fi
                $DC run -d --rm --no-deps --name bt_patch_conf worker \
                  sh -c "mkdir -p /app/models/patch_conf && python scripts/patch_features_confrontations.py calcul --depuis 2025-09-01 --sortie /app/models/patch_conf/patch_conf_0.jsonl > /app/models/patch_conf/calcul.log 2>&1"
                sleep 30
                docker ps --format '{{.Names}} {{.Status}}' | grep bt_patch_conf || echo "ATTENTION : conteneur absent après 30 s"
                ;;
              conf_appliquer|conf_retour)
                if docker ps --format '{{.Names}}' | grep -q '^bt_patch_conf$'; then
                  echo "::error::Calcul du patch conf_* encore en cours."; exit 1
                fi
                OPT=""
                if [ "$ACTION" = conf_retour ]; then OPT="--retour-arriere"; fi
                echo "=== $(date -u) $ACTION ($(git rev-parse --short HEAD))" >> "$LOGS/maintenance-elo.log"
                RC=0
                # Le fichier .resume.json n'existe qu'à la fin d'un calcul complet.
                $DC run --rm --no-deps -T worker sh -c \
                  "test -s /app/models/patch_conf/patch_conf_0.jsonl.resume.json && python scripts/patch_features_confrontations.py appliquer --fichiers '/app/models/patch_conf/patch_conf_*.jsonl' $OPT" \
                  > /tmp/maintenance-conf.out 2>&1 || RC=$?
                tee -a "$LOGS/maintenance-elo.log" < /tmp/maintenance-conf.out
                echo "code retour : $RC"
                exit $RC
                ;;
              statut)
                echo "── ELO ──"; tail -n 30 "$LOGS/maintenance-elo.log" 2>/dev/null || true
                echo "── retrain manuel ──"
                docker ps --format '{{.Names}} {{.Status}}' | grep bt_retrain_manuel || echo "(aucun retrain manuel en cours)"
                $DC exec -T worker sh -c "grep -E 'retrain|promu|rejete|issue|Traceback|Error' /app/models/retrain-manuel.log | tail -n 8" 2>/dev/null || true
                echo "── patch conf_* ──"
                docker ps --format '{{.Names}} {{.Status}}' | grep bt_patch_conf || echo "(aucun calcul conf_* en cours)"
                $DC exec -T worker sh -c "tail -n 5 /app/models/patch_conf/calcul.log; cat /app/models/patch_conf/patch_conf_0.jsonl.resume.json" 2>/dev/null || true
                ;;
            esac
