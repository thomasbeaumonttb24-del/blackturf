name: Photos des hippodromes

# Cherche sur Wikimedia Commons des photos sous licence libre (CC0, domaine public,
# CC BY, CC BY-SA) pour chaque fiche d'hippodrome, et les dépose dans la branche pour
# être choisies à la main. Ne tourne que sur un commit marqué « [photos] » : l'environnement
# de développement n'a pas accès à Commons, les runners GitHub si.
on:
  push:
    branches: [claude/eloquent-planck-ornk0y]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chercher:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[photos]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chercher les photos
        run: python scripts/photos/chercher_photos.py
      - name: Déposer les candidates dans la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/img/hippodromes/_candidates
          git commit -m "Photos hippodromes : candidates Wikimedia Commons" || echo "Rien de nouveau"
          git push
