name: Photos des hippodromes

# Cherche sur Wikimedia Commons des photos sous licence libre (CC0, domaine public,
# CC BY, CC BY-SA) pour chaque fiche d'hippodrome, et les dépose dans la branche lancée. L'environnement
# de développement n'a pas accès à Commons, les runners GitHub si. Lancement manuel :
# sans scripts/photos/selection.json, dépose des candidates à choisir ; avec, télécharge
# la sélection en 1920 px et met à jour les crédits.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chercher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chercher les photos (ou télécharger la sélection)
        run: |
          if [ -f scripts/photos/selection.json ]; then
            python scripts/photos/telecharger_selection.py
            git rm -rq frontend/public/img/hippodromes/_candidates || true
          else
            python scripts/photos/chercher_photos.py
          fi
      - name: Déposer les candidates dans la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend/public/img/hippodromes frontend/src/lib
          git commit -m "Photos hippodromes : fichiers Wikimedia Commons" || echo "Rien de nouveau"
          git push
