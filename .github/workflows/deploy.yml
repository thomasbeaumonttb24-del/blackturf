name: BlackTurf Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/ci.yml"

# Un seul déploiement à la fois sur le VPS — garanti par un VERROU SUR LE VPS
# (flock), plus par la concurrence GitHub.
#
# Historique :
# - 2026-09-25, PR #16/#17 : deux `docker compose up` en parallèle, le nettoyage
#   de l'un a supprimé les conteneurs que l'autre recréait → site en 502.
# - La parade `concurrency: deploy-production` sérialisait bien, mais GitHub ne
#   garde qu'UN run en attente par groupe : à la troisième fusion rapprochée, le
#   run en attente était annulé (#395 le 2026-09-26). Chaque déploiement repart de
#   `origin/main`, donc rien n'était perdu, mais un run « annulé » ne prouve pas
#   que la prod est à jour.
# Désormais tous les runs démarrent ; sur le VPS, chacun attend son tour sur le
# verrou puis déploie `origin/main`. Aucun n'est annulé, aucun ne se chevauche.
#
# Plus d'images GHCR : la prod est buildée sur le VPS (compose en `build:`), ces
# images n'étaient lues par personne. Leur build prenait ~7 min par déploiement —
# assez pour que les fusions s'empilent — et son échec bloquait le vrai
# déploiement (#371, 2026-09-24). La CI (ci.yml) valide déjà les deux Dockerfile.

jobs:
  # ─── Deploy to VPS ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Défaut de l'action : 10 min. Un build sans cache sur le VPS, plus
          # l'attente du verrou derrière un autre déploiement, peut dépasser.
          command_timeout: 50m
          script: |
            set -e

            # ── Verrou : un seul déploiement à la fois sur le VPS ──
            # Libéré automatiquement à la fin du script (ou si la session SSH tombe).
            exec 9>/tmp/blackturf-deploy.lock
            echo "⏳ Attente du verrou de déploiement…"
            flock -w 2400 9 || { echo "::error::Verrou de déploiement non obtenu en 40 min."; exit 1; }
            echo "🔒 Verrou obtenu $(date)"

            cd /opt/blackturf
            DC="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

            # La prod est buildée LOCALEMENT sur le VPS (compose en `build:`, pas d'image
            # GHCR). On synchronise le code puis on rebuild sur place. Cf. HANDOFF SUITE §3.
            # Toujours la DERNIÈRE version de main : un run arrivé après d'autres fusions
            # déploie aussi leur code.
            git fetch origin main
            git reset --hard origin/main
            echo "📦 Déploiement de $(git rev-parse --short HEAD) (run pour ${{ github.sha }})"

            $DC build

            # Pour recréer un conteneur, compose renomme l'ancien en `<id>_<nom>` avant
            # de créer le nouveau. Un déploiement interrompu laisse ce conteneur
            # renommé derrière lui, et le suivant échoue alors sur « Conflict. The
            # container name … is already in use » (vu le 2026-09-24, frontend arrêté).
            # Ces restes ne servent jamais : on les retire avant de redémarrer.
            nettoyer() {
              docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{12}_blackturf_' | xargs -r docker rm -f || true
            }
            nettoyer
            # Une seconde tentative si compose échoue en route (« No such container »,
            # conteneur renommé resté derrière) : sans elle, la prod restait à moitié
            # redémarrée jusqu'à la fusion suivante.
            if ! $DC up -d; then
              echo "⚠️ compose up a échoué, nettoyage puis nouvelle tentative"
              sleep 5
              nettoyer
              $DC up -d
            fi

            # L'API doit répondre avant les migrations (exec sur un conteneur qui
            # démarre échoue) ; jusqu'à 2 min, au lieu d'un unique essai à 12 s.
            attendre_api() {
              for i in $(seq 1 40); do
                if curl -fsS http://localhost:8000/api/v1/health >/dev/null 2>&1; then return 0; fi
                sleep 3
              done
              return 1
            }
            if ! attendre_api; then
              echo "::error::L'API ne répond pas après redémarrage."
              $DC ps
              $DC logs --tail 80 api
              exit 1
            fi

            # Migrations en attente (idempotentes)
            $DC exec -T api alembic -c db/migrations/alembic.ini upgrade head

            attendre_api || { echo "::error::L'API ne répond plus après les migrations."; $DC logs --tail 80 api; exit 1; }

            # Nettoyage images orphelines
            docker image prune -f

            echo "✅ Deploy complete $(date) — $(git rev-parse --short HEAD)"

  # ─── Smoke Test Production ────────────────────────────────────────────────
  smoke-test:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Health check
        run: |
          # Le frontend Next met quelques secondes à servir après son redémarrage :
          # plusieurs essais plutôt qu'un seul à 15 s.
          essayer() {
            for i in $(seq 1 12); do
              if curl -fsS -o /dev/null "$1"; then echo "$1 : OK"; return 0; fi
              sleep 10
            done
            echo "::error::$1 ne répond pas"
            return 1
          }
          essayer https://api.blackturf.fr/api/v1/health
          essayer https://blackturf.fr

      # Un site entièrement désindexé répond 200 : le health check ci-dessus le
      # déclarerait sain. Ces trois contrôles couvrent les pannes silencieuses qui
      # coûtent des semaines avant d'être remarquées en Search Console.
      - name: Indexabilité
        run: |
          set -euo pipefail

          # 1. L'accueil ne doit jamais être servi en noindex, par la balise
          #    comme par l'en-tête HTTP.
          #    La balise est EXTRAITE avant d'etre testee : un motif qui exige
          #    name="robots" avant le noindex rate `<meta content="noindex"
          #    name="robots">`, et un simple `grep noindex` sur la page entiere se
          #    declenche sur le mot present dans un texte. Verifie sur les deux ordres.
          if curl -fsS https://blackturf.fr \
               | grep -oiE '<meta[^>]*name="robots"[^>]*>' | grep -qi 'noindex'; then
            echo "::error::L'accueil est servi avec une balise robots noindex."
            exit 1
          fi
          if curl -fsSI https://blackturf.fr | grep -qiE '^x-robots-tag:.*noindex'; then
            echo "::error::L'accueil est servi avec un en-tete X-Robots-Tag noindex."
            exit 1
          fi

          # 2. L'index de sitemaps doit lister ses enfants.
          curl -fsS https://blackturf.fr/sitemap.xml | grep -q '<sitemap>' || {
            echo "::error::L'index de sitemaps ne liste aucun enfant."
            exit 1
          }

          # 3. `fetchSeoIndex` renvoie une liste vide quand l'API echoue, par choix :
          #    une page ne doit jamais tomber en 500 sur une donnee SEO. Le revers est
          #    qu'un sitemap vide part en cache pour une heure sans rien casser
          #    d'observable. On exige donc un plancher d'URLs sur `pages.xml`, dont le
          #    contenu est statique et ne depend d'aucun appel API.
          N=$(curl -fsS https://blackturf.fr/sitemaps/pages.xml | grep -c '<url>' || true)
          echo "pages.xml : $N URLs"
          if [ "$N" -lt 40 ]; then
            echo "::error::pages.xml ne contient que $N URLs (plancher : 40)."
            exit 1
          fi

          echo "Indexabilite : OK"
