name: BlackTurf Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/ci.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/blackturf-api
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/blackturf-frontend

jobs:
  # ─── Build & Push Docker images ───────────────────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      api_tag: ${{ steps.meta-api.outputs.version }}
      frontend_tag: ${{ steps.meta-frontend.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── API ──
      - name: Docker meta (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ──
      - name: Docker meta (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build & push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.blackturf.fr
            NEXT_PUBLIC_WS_URL=wss://api.blackturf.fr/ws
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to VPS ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/blackturf

            # La prod est buildée LOCALEMENT sur le VPS (compose en `build:`, pas d'image
            # GHCR). On synchronise le code puis on rebuild sur place. Cf. HANDOFF SUITE §3.
            git fetch origin main
            git reset --hard origin/main

            # Build + (re)start des images locales
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # Migrations en attente (idempotentes)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api \
              alembic -c db/migrations/alembic.ini upgrade head

            # Health check
            sleep 12
            curl -f http://localhost:8000/api/v1/health || exit 1

            # Nettoyage images orphelines
            docker image prune -f

            echo "✅ Deploy complete $(date) — $(git rev-parse --short HEAD)"

  # ─── Smoke Test Production ────────────────────────────────────────────────
  smoke-test:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Health check
        run: |
          sleep 15
          curl -f https://api.blackturf.fr/api/v1/health
          echo "API health: OK"
          curl -f https://blackturf.fr
          echo "Frontend: OK"
