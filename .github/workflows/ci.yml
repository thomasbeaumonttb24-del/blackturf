name: BlackTurf CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── ML Unit Tests ────────────────────────────────────────────────────────
  test-ml:
    name: ML Unit Tests (no Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ML unit tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-secret-key-change-in-production-must-be-64-chars-min-ok"
          ENVIRONMENT: "test"
        run: pytest tests/test_ml_units.py -v --tb=short

  # ─── API Integration Tests ────────────────────────────────────────────────
  test-api:
    name: API Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests (SQLite in-memory)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-secret-key-change-in-production-must-be-64-chars-min-ok"
          ENVIRONMENT: "test"
        run: |
          pytest tests/test_health.py tests/test_auth.py -v --tb=short

  # ─── Frontend Type Check ──────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ─── Frontend Build ───────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-typecheck
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_WS_URL: "ws://localhost:8000/ws"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
          NEXTAUTH_SECRET: "ci-secret"
          NEXTAUTH_URL: "http://localhost:3001"
        run: npm run build

  # ─── Docker Build (main only) ─────────────────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test-ml, test-api, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t blackturf-api:ci ./backend

      - name: Build frontend image
        run: docker build -t blackturf-frontend:ci ./frontend

      - name: Smoke test API image
        run: |
          docker run -d --name api_smoke \
            -e DATABASE_URL="sqlite+aiosqlite:///:memory:" \
            -e REDIS_URL="redis://localhost:6379/0" \
            -e SECRET_KEY="ci-secret-key-change-in-production-must-be-64-chars-min-ok" \
            -e ENVIRONMENT="test" \
            -p 8000:8000 \
            blackturf-api:ci \
            uvicorn api.main:app --host 0.0.0.0 --port 8000
          sleep 5
          curl -f http://localhost:8000/api/v1/health || (docker logs api_smoke && exit 1)
          docker stop api_smoke
