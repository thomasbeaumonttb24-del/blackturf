name: Diag outsiders (temporaire)
on:
  push:
    branches: [claude/affectionate-ritchie-o7cygj]
    paths: [".github/workflows/diag-outsiders.yml"]
jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.blackturf.fr/api/v1
          date -u
          echo "== bilan"; curl -sS "$A/outsiders/bilan?jours=7" | python3 -c "import sys,json;d=json.load(sys.stdin);print(json.dumps({k:v for k,v in d.items() if k!='plus_beaux'},indent=1))"
          echo "== jour"; curl -sS "$A/outsiders/jour" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['jour'],len(d['outsiders']),d['outsiders'][:3])"
